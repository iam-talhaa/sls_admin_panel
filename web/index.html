<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swiss Luxury Services (SLS) - Web Admin Panel for Private Jet Charter & Concierge Management">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SLS Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Swiss Luxury Services | Admin Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #1E1E1E;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1E1E1E;
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(237, 28, 36, 0.2);
      border-top-color: #ED1C24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 10px;
      text-transform: uppercase;
    }
    .brand-title span {
      color: #ED1C24;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="brand-title"><span>SWISS</span> LUXURY SERVICES</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
</body>
</html>
