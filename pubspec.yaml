name: sls_admin
description: "Swiss Luxury Services (SLS) Web Admin Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # File Picking & Charts & Utils
  file_picker: ^8.0.5
  fl_chart: ^0.68.0
  csv: ^6.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
