include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use: ignore
    unnecessary_underscores: ignore
    use_null_aware_elements: ignore

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: false
